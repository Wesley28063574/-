<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>嵐星｜卡通音色試聽</title><style>*{box-sizing:border-box}body{margin:0;background:#fff9d9;color:#123e70;font-family:system-ui,sans-serif}header{background:#ffe33b;border-bottom:5px solid #1456a2;text-align:center;padding:25px}h1{margin:0;font-size:clamp(30px,4vw,48px)}main{max-width:1200px;margin:auto;padding:25px}.intro{text-align:center;font-size:22px;line-height:1.7}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin:30px 0}.card{background:white;border:3px solid #1456a2;border-radius:22px;padding:24px;box-shadow:5px 5px 0 #ffe33b;text-align:center}.badge{background:#1456a2;color:#ffe33b;border-radius:50%;width:65px;height:65px;display:grid;place-items:center;font-size:36px;font-weight:bold;margin:auto}h2{font-size:27px}.card p{font-size:19px;line-height:1.7;min-height:65px}audio{display:block;width:100%;margin:20px 0}label{display:block;font-size:18px;cursor:pointer}.script{background:#edf5ff;border-radius:18px;padding:24px;font-size:22px;line-height:1.8}.note{font-size:18px;line-height:1.7;text-align:center}.back{display:block;width:fit-content;background:#1456a2;color:white;border-radius:12px;padding:14px 24px;text-decoration:none;margin:25px auto;font-weight:bold}@media(max-width:760px){.cards{grid-template-columns:1fr}main{padding:18px}.card p{min-height:0}.script{font-size:20px}}</style></head><body><header><h1>嵐星的聲音：C 圓潤版＋快樂配樂</h1></header><main><p class="intro">C 圓潤人聲＋快樂、蹦蹦跳跳的新配樂。<br>明亮旋律、彈跳低音與輕拍節奏；可切換純人聲。</p><div class="cards" style="grid-template-columns:minmax(0,650px);justify-content:center"><article class="card"><div class="badge">C</div><h2>跳跳小吉祥物・圓潤版</h2><p>人聲維持圓潤版，搭配更快樂、明亮的新配樂。</p><audio controls preload="metadata" src="assets/voice/cute-c-round-happy.mp3" aria-label="C圓潤版試聽"></audio><label><input id="clean-toggle" type="checkbox">只聽人聲</label></article></div><details style="margin:25px auto;max-width:650px"><summary>比較上一版配樂</summary><audio controls preload="metadata" src="assets/voice/cute-c-round.mp3" aria-label="上一版配樂試聽"></audio></details><details style="margin:25px auto;max-width:650px"><summary>只聽快樂配樂</summary><audio controls preload="metadata" src="assets/voice/music-happy.mp3" aria-label="快樂配樂試聽"></audio></details><div class="script"><strong>共同試聽台詞</strong><br>嗨，大家好！我是嵐星！今天，我們要一起做珍珠紅茶拿鐵。準備好了嗎？拿起紙杯，加入兩湯匙珍珠，再量一百五十毫升牛奶。一起動手吧！</div><p class="note">本版以音高與語速處理加強卡通感，並非特定卡通人物的配音；尚未套用到完整示範。<br>聽聽看，這次的圓潤程度是否更接近你要的感覺。</p><a class="back" href="Lansatar/">回到 Lansatar 遊戲</a></main><script>document.querySelectorAll('audio').forEach(audio=>audio.addEventListener('play',()=>document.querySelectorAll('audio').forEach(other=>{if(other!==audio)other.pause()})));document.getElementById('clean-toggle').addEventListener('change',event=>{const audio=document.querySelector('.card audio');audio.pause();audio.src='assets/voice/cute-c-round'+(event.target.checked?'-clean':'-happy')+'.mp3';audio.load()});</script></body></html>
