<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>嵐星｜A4成果模板預覽</title><link rel="stylesheet" href="assets/activity-admin.css?v=4"><link rel="stylesheet" href="assets/a4-report.css?v=7"></head><body><header><h1>A4成果模板預覽</h1><a href="Lansatar/?v=a4-radar-1">返回活動首頁</a></header><main><p class="notice">這是空白模板。正式活動會自動套用單位、日期、店名、後台成果圖，以及六題完成後的實際能力數值與評語。此頁不會建立活動紀錄。</p><div class="a4-toolbar"><button id="print-template">列印／另存 A4 PDF</button><button id="download-template">下載 A4 PNG 模板</button><a href="admin.html?v=a4-radar-1">前往活動後台</a></div><p id="message" class="a4-error" role="status"></p><div id="template"></div></main><script src="assets/a4-report.js?v=7"></script><script>const sample={meta:{},content:{},state:{groups:[{name:'店名待填',history:[],scores:[]}]}};document.getElementById('template').append(A4Report.preview(sample,0));document.getElementById('print-template').onclick=()=>A4Report.print(sample,[0]).catch(error=>document.getElementById('message').textContent=error.message);document.getElementById('download-template').onclick=()=>A4Report.downloadPNG(sample,0).catch(error=>document.getElementById('message').textContent=error.message);</script></body></html>
