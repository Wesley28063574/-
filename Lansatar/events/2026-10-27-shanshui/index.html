function e(t,text,cls){const n=document.createElement(t);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}function b(text,fn,cls){const n=e('button',text,cls);n.onclick=fn;return n}function stop(){stopMusic();if(tick)clearInterval(tick);tick=null;endAt=null}function setTime(n){stop();seconds=n}function clock(){const n=document.getElementById('clock');if(n)n.textContent=seconds?Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0'):'時間到，請完成提交！'}function start(){if(tick||!seconds)return;startMusic();endAt=Date.now()+seconds*1000;tick=setInterval(()=>{seconds=Math.max(0,Math.ceil((endAt-Date.now())/1000));clock();updateStage();if(!seconds){stop();render();updateStage()}},250);render();openStage()}function timer(label){stageLabel=label;const box=e('div',undefined,'timer');box.append(e('strong',label));const c=e('strong');c.id='clock';box.append(c,b(tick?'倒數中':'開始／繼續',start,'yellow'),b('暫停',()=>{if(tick)seconds=Math.max(0,Math.ceil((endAt-Date.now())/1000));stop();render()},'light'));app.append(box);clock()}

function carry(g){if(round===0)return '';const prev=g.history[round-1];if(prev>=3)return '上次的誇張點子提醒我們：魔法不能代替行動，這次可以重新選擇、找出可行做法。';if(round===1)return ['上次快速重做後，還需要找到錯誤原因。','上次確認訂單時，團隊感受到客人等待的壓力。','上次多人同時協助後，團隊發現分工需要更清楚。'][prev];if(round===2)return ['新人還沒練習支援，需要先示範。','新人能協助練習過的步驟，開始發揮作用。','新人可以完成熟悉的部分，再逐步增加任務。'][prev];return ['先前選擇直接處理，這次也需要補上後續確認。','先前累積的討論與紀錄，可以幫助這次協調。','先前嘗試調整做法，這次仍要確認分工與成效。'][prev]}
function answeredCount(g){return g.history.filter(Number.isInteger).length}function ending(g){const h=g.history;if(answeredCount(g)<6)return ['門市故事進行中','目前已完成'+answeredCount(g)+'／6題，能力圖僅反映已作答的選擇。未完成題目不會計分，完整結局將在六題完成後揭曉。','可透過上方導覽自由查看或補答題目。'];if(h.filter(v=>v>=3).length>=3)return ['從奇想走向行動的門市','你們嘗試了不少誇張點子，也看見有些方法無法解決現場問題。這不是故事終點，下一次可以把創意轉成可行的合作行動。','先問這個方法真的能做到嗎，再一起選一個具體小步驟。'];if(h[5]===2&&h[4]===1)return ['走向世界的合作團隊','你們先協調門市需求，再透過測試理解新市場，獲得海外合作準備的學習機會。','練習介紹工作流程，並傾聽不同文化的需求。'];if(h[4]===1&&h[3]!==0)return ['多店協作的推動者','你們使用資料與協調安排資源，開始探索區長所需的多店管理能力。','比較不同做法，提出有依據的改善建議。'];if(h[1]===1&&h[2]===1)return ['一起成長的示範店','你們陪新人學習，也先確認夥伴需要什麼，逐漸形成互相支援的團隊。','教別人一項技能，再確認他能獨立完成。'];if(h[1]===0&&h[2]===2)return ['重新調整的成長門市','你們常先接手眼前工作，現在發現培養夥伴同樣重要，決定展開新的訓練計畫。','安排練習與交接，讓更多夥伴能獨立支援。'];return ['值得信賴的品質門市','你們累積了服務、流程與現場經驗，持續改善品質，也準備選擇下一個學習方向。','為日常工作建立簡單檢查清單。']}
function radar(g){const ns='http://www.w3.org/2000/svg',svg=document.createElementNS(ns,'svg');svg.setAttribute('viewBox','0 0 400 330');svg.setAttribute('role','img');svg.setAttribute('aria-label',g.name+'店團隊能力圖');svg.style.width='100%';svg.style.maxWidth='480px';const pt=(i,r)=>[200+Math.cos(-Math.PI/2+i*Math.PI/3)*r,165+Math.sin(-Math.PI/2+i*Math.PI/3)*r];function sh(t,a){const n=document.createElementNS(ns,t);Object.entries(a).forEach(([k,v])=>n.setAttribute(k,v));svg.append(n);return n}for(let r=1;r<=5;r++)sh('polygon',{points:names.map((_,i)=>pt(i,r*21).join(',')).join(' '),fill:'none',stroke:'#cad7eb'});names.forEach((n,i)=>{const [x,y]=pt(i,142);const t=sh('text',{x,y,'text-anchor':'middle','dominant-baseline':'middle','font-size':14,fill:'#123e70'});t.textContent=n});sh('polygon',{points:g.scores.map((v,i)=>pt(i,v*1.05).join(',')).join(' '),fill:'#ffe33baa',stroke:'#1456a2','stroke-width':3});return svg}

function feedback(g){const ranked=g.scores.map((v,i)=>({v,i})).sort((a,b)=>b.v-a.v);const praise=['你們願意作出決定，也逐漸學會考慮後果。這份判斷力會在一次次練習中更穩定。','你們讓不同工作站的夥伴一起參與。懂得互相支援，是團隊很珍貴的力量。','你們願意傾聽並說明想法。清楚又友善的溝通，能讓客人與夥伴更安心。','你們留意確認與品質。這些細心的小動作，是值得信賴的門市基礎。','你們開始考慮備料、人力與資源。能看見整間店的需求，是經營思維的起點。','你們願意理解新需求、嘗試新做法。保持好奇心，會為團隊打開更多可能。'];const tips=['下次先說出兩個方案的好處與代價，再一起選擇。','下次先問每個工作站需要什麼，讓支援更精準。','下次用一句話確認對方的需求，再說明自己的安排。','下次建立一張簡單檢查清單，讓每位夥伴都能使用。','下次記錄用量與人力狀況，讓規劃有更多依據。','下次向不同想法的夥伴提一個問題，試著理解他的理由。'];return {top:ranked.slice(0,2).map(x=>({name:names[x.i],text:praise[x.i]})),growth:{name:names[ranked[5].i],text:tips[ranked[5].i]},note:'這是本次選擇呈現的團隊特色，不是固定能力標籤。每個人都有成長空間，你們已經一起完成六個挑戰！'}}

function tone(freq,length,kind='sine',level=.18){if(!audioCtx||!master)return;const osc=audioCtx.createOscillator(),gain=audioCtx.createGain(),t=audioCtx.currentTime;osc.type=kind;osc.frequency.setValueAtTime(freq,t);if(kind==='sine'&&freq<200)osc.frequency.exponentialRampToValueAtTime(42,t+length);gain.gain.setValueAtTime(level,t);gain.gain.exponentialRampToValueAtTime(.001,t+length);osc.connect(gain);gain.connect(master);osc.start(t);osc.stop(t+length)}

function musicBeat(){const fast=seconds<=30,bpm=fast?144:104;if(beat%4===0)tone(145,.15,'sine',.5);if(beat%4===2)tone(200,.08,'triangle',.14);tone(2500,.035,'triangle',beat%2?.035:.065);if(beat%2===0){const notes=[261.63,329.63,392,329.63,293.66,349.23,440,349.23];tone(notes[Math.floor(beat/2)%8],.17,'triangle',.12)}if(fast&&beat%4===0)tone(523,.09,'triangle',.12);beat++;musicLoop=setTimeout(musicBeat,60000/bpm/2)}
