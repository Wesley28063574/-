<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>嵐芽雪克手｜善水國中成果管理</title><style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#143a73}*{box-sizing:border-box}body{background:#eaf3ff;margin:0}header{background:#074a98;color:#fff;padding:16px 5%;font-size:23px;font-weight:800}main{max-width:1120px;margin:20px auto;padding:0 16px}.note{background:#fff8cf;border-left:5px solid #ffcb20;padding:14px;line-height:1.65;border-radius:8px}.bar,.panel{background:white;border:1px solid #c9d9ed;border-radius:16px;padding:18px;margin:16px 0}button,select,input,textarea{font:inherit;padding:9px;border-radius:8px;border:1px solid #a7bdd5}button{background:#0757a7;color:white;border:none;cursor:pointer;margin:4px}select{max-width:100%}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}label{display:block;margin:10px 0}.preview{max-width:450px;width:100%;height:auto;object-fit:contain}.report{display:none}.sheet{width:210mm;min-height:297mm;padding:10mm;background:white;color:#173c77;margin:auto}.sheet h1{background:#0b4b9c;color:#ffe543;padding:10px;margin:0 0 12px;font-size:25px}.photo{width:100%;height:auto;display:block;border:3px solid #1956a2}.reportgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.box{border:2px solid #e0b632;border-radius:13px;padding:14px;margin-top:12px}.box h3{margin:0 0 8px}.signature{height:135px;border:2px solid #e0b632;border-radius:12px;padding:15px;margin-top:12px}.signline{margin:65px 8px 0;border-bottom:1px solid #45618a}.muted{color:#5d7290}.signature small{display:block}.listanswers{line-height:1.8}@media print{body{background:white}header,main,.note,.bar,.panel{display:none!important}.report{display:block}.sheet{break-after:page;page-break-after:always}}@page{size:A4 portrait;margin:0}
</style><header>嵐芽雪克手｜善水國中成果管理</header><main><div class="note">本頁為獨立成果管理工具，不會改動正在執行的遊戲。既有六題作答未同步至此頁，請依現場紀錄補入；資料儲存在「目前瀏覽器」，不是共用雲端資料庫，請務必匯出備份。</div><div class="bar row"><label>組別<select id="team"></select></label><button id="print">下載／列印目前組別 PDF</button><button id="all">全部組別一次列印</button><button id="backup">匯出 JSON 備份</button><label>匯入備份<input type="file" id="restore" accept="application/json"></label></div><div class="panel"><h2 id="title"></h2><label>店面完整漫畫成果卡（不裁切）<input type="file" id="photo" accept="image/*"></label><img class="preview" id="preview"><h3>六題實際作答</h3><div id="answers"></div><label>組別特色／團隊觀察<textarea id="notes" rows="4" style="width:100%"></textarea></label><button id="save">儲存這組資料</button></div></main><div class="report" id="report"></div><script>
const names=['來杯好茶搖一搖','尬電','庠喝洵思茶','一定要喝','被被茶'];
const questions=['這杯不是我要的！','我不敢再做了……','各站忙不過來怎麼辦？','收店後如何規劃備料？','多店合作如何分配資源？','如何因應海外新市場？'];
const key='lanstar-shanshui-2026-v1', model=()=>({photo:'',answers:['','','','','',''],notes:''});
let data={};try{data=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
for(const n of names)if(!data[n])data[n]=model();
const el=id=>document.getElementById(id),save=()=>{localStorage.setItem(key,JSON.stringify(data));};
el('team').innerHTML=names.map(n=>'<option>'+n+'</option>').join('');
let current=names[0];function collect(){const item=data[current];item.answers=[...document.querySelectorAll('.answer')].map(x=>x.value);item.notes=el('notes').value;save();}
function refresh(){current=el('team').value;const x=data[current];el('title').textContent=current;el('preview').src=x.photo||'';el('preview').style.display=x.photo?'':'none';el('notes').value=x.notes||'';el('answers').innerHTML=questions.map((q,i)=>'<label>'+(i+1)+'．'+q+'　<select class="answer" data-i="'+i+'"><option value="">尚未取得</option><option value="0">選項一</option><option value="1">選項二</option><option value="2">選項三</option></select></label>').join('');[...document.querySelectorAll('.answer')].forEach((e,i)=>e.value=x.answers[i]??'');}
el('team').onchange=()=>{collect();refresh()};el('save').onclick=()=>{collect();alert('已儲存在目前瀏覽器，請另外匯出 JSON 備份。')};
el('photo').onchange=async e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{data[current].photo=reader.result;try{save();refresh()}catch(err){alert('圖片過大，瀏覽器儲存空間不足；請先縮圖再上傳。')}};reader.readAsDataURL(f)};
function escapeHTML(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function reportFor(n){const x=data[n],cnt=x.answers.filter(x=>x!=='').length;const photo=x.photo?'<img class="photo" src="'+x.photo+'">':'<div class="box muted">尚未上傳店面漫畫成果卡</div>';return '<article class="sheet"><h1>嵐芽雪克手｜組別成果報告</h1>'+photo+'<h2>組別｜'+escapeHTML(n)+'</h2><div class="reportgrid"><div class="box"><h3>組別成果</h3><p>已核對作答：'+cnt+'／6 題</p><p>'+escapeHTML(x.notes||'團隊觀察尚待補入')+'</p></div><div class="box"><h3>六題實際作答</h3><div class="listanswers">'+questions.map((q,i)=>(i+1)+'. '+escapeHTML(q)+'：'+(x.answers[i]!==''?'選項'+(Number(x.answers[i])+1):'待核對')).join('<br>')+'</div></div></div><div class="box"><h3>團隊能力分析</h3><p>'+(cnt===6?'六題選項已登錄，可依遊戲原始計分規則進一步分析。':'作答紀錄未齊，不產生虛構能力評分。')+'</p></div><div class="signature"><strong>★ 嵐星</strong><small>中區50嵐集團執行董事 暨 嵐星文藝體育事執行長</small><div class="signline"></div></div></article>'}
function printTeams(arr){collect();el('report').innerHTML=arr.map(reportFor).join('');setTimeout(()=>window.print(),180)}
el('print').onclick=()=>printTeams([current]);el('all').onclick=()=>printTeams(names);
el('backup').onclick=()=>{collect();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,teams:data},null,2)],{type:'application/json'}));a.download='善水國中_嵐芽雪克手_成果資料.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
el('restore').onchange=async e=>{try{let obj=JSON.parse(await e.target.files[0].text());let x=obj.teams||obj;for(const n of names)if(x[n])data[n]={...model(),...x[n]};save();refresh()}catch(err){alert('匯入失敗，請確認備份檔案。')}};
refresh();
</script></html>
