<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>嵐星｜活動後台</title><link rel="stylesheet" href="assets/activity-admin.css?v=2"></head><body><header><h1>嵐星 活動後台</h1><a href="Lansatar/?v=event-start-1">首頁建立活動</a></header><main><p id="storage-mode" class="notice"></p><p class="notice">每場活動結束 → 匯出完整備份 → 存放公司資料夾。需要回顧時，再匯入備份即可。</p><p id="status" role="status"></p><section id="cloud-panel" hidden><h2>雲端帳號登入</h2><form id="login-form"><label>電子郵件<input type="email" id="email" autocomplete="username" required></label><label>密碼<input type="password" id="password" autocomplete="current-password" required></label><button>登入並讀取雲端活動</button><button type="button" id="logout">登出</button></form></section><section><details><summary>進階建立活動（選填更多資料）</summary><form id="new-event"><div class="fields"><label>活動名稱<input name="name" maxlength="100" required placeholder="例如：○○國中門市挑戰"></label><label>日期<input name="date" type="date" required></label><label>學校／單位<input name="organization" maxlength="100"></label><label>地點<input name="location" maxlength="100"></label><label>活動類型<select name="kind"><option>偏鄉活動</option><option>學生參訪</option><option>其他活動</option></select></label><label>遊戲版本<select name="ageGroup"><option value="elementary">國小</option><option value="secondary" selected>國高中</option><option value="university">大學</option></select></label><label>對象／年齡層<input name="audience" maxlength="100" placeholder="例如：國中一年級"></label><label>主持人<input name="facilitator" maxlength="100"></label><label>實際人數<input name="participants" type="number" min="0" max="10000"></label><label>組數<select name="groupCount"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></label></div><label>活動備註<textarea name="notes" maxlength="10000"></textarea></label><button>建立獨立活動檔案</button></form></details></section><section><div class="toolbar"><h2>活動紀錄</h2><a href="Lansatar/results-admin.html" target="_blank" rel="noopener">既有善水國中成果工具</a><input id="search" type="search" placeholder="搜尋活動、學校、主持人" aria-label="搜尋活動"><button id="refresh">重新整理／同步</button><label class="import-label">匯入活動備份<input type="file" id="import-file" accept="application/json,.json"></label></div><div id="events"></div></section><section id="event-detail" hidden></section></main><script src="assets/cloud-config.js"></script><script src="assets/activity-store.js?v=2"></script><script src="assets/activity-template.js?v=1"></script><script src="assets/age-content.js?v=3"></script><script src="assets/activity-admin.js?v=4"></script></body></html>
